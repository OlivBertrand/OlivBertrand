<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zantho App">
  <title>Zantho App</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/apple-touch-icon.png">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f0;color:#173f2d;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border:1px solid #dfe5dc;border-radius:24px;padding:28px;box-shadow:0 12px 36px #14331f12;text-align:center}
    img{width:132px;height:132px;border-radius:24px;object-fit:cover;margin-bottom:12px}
    h1{margin:4px 0 8px;font-size:30px;letter-spacing:.08em} p{color:#5c665f;line-height:1.5;margin:8px 0 18px}
    .box{background:#f7f8f4;border-radius:16px;padding:16px;text-align:left;line-height:1.5}
    a{display:inline-block;margin-top:18px;background:#173f2d;color:#fff;text-decoration:none;padding:13px 18px;border-radius:14px;font-weight:700}
  </style>
</head>
<body>
<main>
  <img src="/apple-touch-icon.png" alt="Logo Zantho">
  <h1>ZANTHO APP</h1>
  <p>Page dédiée à l’installation sur l’iPhone.</p>
  <div class="box"><strong>Dans Safari :</strong><br>Partager → Sur l’écran d’accueil → laisser « Ouvrir comme app web » activé → Ajouter.<br><br>L’icône doit s’appeler <strong>Zantho App</strong>.</div>
  <a href="/">Ouvrir Zantho dans Safari</a>
</main>
<script>
  if (window.navigator.standalone === true) {
    location.replace('/?source=zantho-app-icon');
  }
</script>
</body>
</html>
